<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>驿站平面布局设计 V3</title>
<!-- V3 / 2026-11-17：矩形组合(L/T)、自由画布、数字输入、标准色板、SVG 渲染 -->
<style>
    :root { --primary:#2563eb; --bg:#f1f5f9; --border:#cbd5e1; --danger:#ef4444; --accent:#f59e0b; }
    * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
    body { font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; background:var(--bg); display:flex; flex-direction:column; height:100vh; overflow:hidden; }

    .toolbar { background:#fff; padding:8px 10px; display:flex; gap:10px; flex-wrap:wrap; align-items:center; border-bottom:1px solid var(--border); z-index:100; box-shadow:0 2px 5px rgba(0,0,0,.05); }
    .tool-group { display:flex; align-items:center; gap:5px; font-size:13px; color:#334155; }
    .tool-group input[type=number] { width:52px; padding:4px; border:1px solid var(--border); border-radius:4px; font-size:13px; }
    .btn { padding:6px 11px; border:none; border-radius:6px; background:var(--primary); color:#fff; cursor:pointer; font-size:13px; font-weight:600; }
    .btn:active { opacity:.8; }
    .btn:disabled { opacity:.4; cursor:default; }
    .btn-outline { background:#fff; color:#334155; border:1px solid var(--border); }
    .btn-danger { background:var(--danger); }
    .btn-accent { background:var(--accent); }
    .sep { width:1px; height:20px; background:var(--border); }

    .main-container { display:flex; flex:1; overflow:hidden; position:relative; }
    .canvas-wrapper { flex:1; overflow:auto; position:relative; background:#e2e8f0; touch-action:none; }
    .stage { position:relative; }

    .sidebar { width:310px; background:#fff; border-left:1px solid var(--border); display:flex; flex-direction:column; overflow-y:auto; }
    .sidebar-header { padding:12px 14px; font-weight:700; font-size:14px; border-bottom:1px solid var(--border); background:#f8fafc; position:sticky; top:0; z-index:10; }
    .legend-item { padding:9px 12px; border-bottom:1px solid var(--border); display:flex; align-items:flex-start; gap:8px; cursor:pointer; }
    .legend-item:hover { background:#f1f5f9; }
    .legend-item.active { background:#e0f2fe; border-left:4px solid var(--primary); }
    .color-box { width:18px; height:18px; border-radius:4px; flex-shrink:0; border:1px solid rgba(0,0,0,.2); margin-top:2px; }
    .legend-info { flex:1; min-width:0; }
    .legend-title { font-size:13px; font-weight:700; margin-bottom:1px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .legend-desc { font-size:11px; color:#64748b; line-height:1.3; }
    .legend-area { font-size:11px; color:var(--primary); margin-top:2px; }
    .legend-actions { display:flex; flex-wrap:wrap; gap:3px; justify-content:flex-end; width:76px; }
    .icon-btn { width:21px; height:21px; display:flex; justify-content:center; align-items:center; border:1px solid var(--border); background:#fff; border-radius:4px; cursor:pointer; font-size:11px; padding:0; }
    .icon-btn.active { background:#e0f2fe; border-color:var(--primary); }
    .icon-btn.danger { color:var(--danger); }

    .modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,.5); display:none; justify-content:center; align-items:center; z-index:99999; padding:12px; }
    .modal-overlay.show { display:flex; }
    .modal { background:#fff; width:100%; max-width:440px; border-radius:12px; padding:18px; box-shadow:0 10px 25px rgba(0,0,0,.2); max-height:88vh; overflow-y:auto; }
    .modal h3 { margin-bottom:14px; font-size:17px; }
    .form-group { margin-bottom:10px; }
    .form-group label { display:block; font-size:12px; color:#64748b; margin-bottom:3px; }
    .form-group input[type=text], .form-group input[type=number], .form-group textarea { width:100%; padding:7px 9px; border:1px solid var(--border); border-radius:6px; font-family:inherit; font-size:14px; }
    .form-group input[type=color] { width:100%; height:36px; padding:0; border:none; cursor:pointer; }
    .row4 { display:grid; grid-template-columns:1fr 1fr 1fr 1fr; gap:6px; }
    .modal-actions { display:flex; justify-content:flex-end; gap:8px; margin-top:16px; }
    .swatches { display:grid; grid-template-columns:repeat(8,1fr); gap:5px; margin-top:6px; }
    .sw { width:100%; aspect-ratio:1; border-radius:5px; border:2px solid transparent; cursor:pointer; }
    .sw.on { border-color:#0f172a; }
    .seg-table { width:100%; border-collapse:collapse; font-size:12px; margin-top:6px; }
    .seg-table th, .seg-table td { border-bottom:1px solid #e2e8f0; padding:3px; text-align:center; }
    .seg-table input { width:100%; padding:3px; border:1px solid var(--border); border-radius:4px; text-align:center; font-size:12px; }
    .seg-del { color:var(--danger); cursor:pointer; border:none; background:none; font-size:13px; }

    @media (max-width:820px) {
        .main-container { flex-direction:column; }
        .canvas-wrapper { flex:2; }
        .sidebar { width:100%; flex:1; border-left:none; border-top:1px solid var(--border); }
    }
</style>
</head>
<body>

<div class="toolbar">
    <div class="tool-group">
        <span>网格</span>
        <input type="number" id="grid-cols" value="20" min="5" max="60">
        <span>×</span>
        <input type="number" id="grid-rows" value="15" min="4" max="40">
        <button class="btn btn-outline" onclick="applyGrid()">应用</button>
    </div>
    <div class="tool-group sep"></div>
    <div class="tool-group">
        <span>格边长</span>
        <input type="number" id="cell-size" value="30" min="20" max="60" step="2" onchange="applyCell()">
        <span>px</span>
        <span style="margin-left:6px;">1格=</span>
        <input type="number" id="scale-m" value="1" min="0.1" step="0.1" style="width:52px;">
        <span>米</span>
    </div>
    <div class="tool-group sep"></div>
    <div class="tool-group">
        <span>扩展</span>
        <input type="number" id="extend-n" value="4" min="1" max="20" style="width:44px;">
        <span>格：</span>
        <button class="btn btn-outline" onclick="extend(-1,0)">← 左</button>
        <button class="btn btn-outline" onclick="extend(0,-1)">↑ 上</button>
        <button class="btn btn-outline" onclick="extend(0,1)">↓ 下</button>
        <button class="btn btn-outline" onclick="extend(1,0)">→ 右</button>
    </div>
    <div class="tool-group" style="margin-left:auto;">
        <button class="btn btn-outline" id="btn-undo" onclick="undo()" disabled>↩ 撤销</button>
        <button class="btn btn-outline" id="btn-redo" onclick="redo()" disabled>↪ 重做</button>
        <button class="btn btn-outline" onclick="document.getElementById('import-file').click()">📂 导入</button>
        <input type="file" id="import-file" accept=".json" style="display:none" onchange="importJSON(event)">
        <button class="btn btn-outline" onclick="exportPNG()">🖼 图片</button>
        <button class="btn btn-outline" onclick="exportJSON()">💾 导出</button>
        <button class="btn btn-danger" onclick="clearAll()">清空</button>
    </div>
</div>

<div class="main-container">
    <div class="canvas-wrapper" id="wrapper">
        <div class="stage" id="stage">
            <svg id="svg" xmlns="http://www.w3.org/2000/svg"></svg>
        </div>
    </div>
    <div class="sidebar">
        <div class="sidebar-header">图例与图层 <span style="font-weight:400;font-size:11px;color:#94a3b8;">（点选后可用手柄或数字调整）</span></div>
        <div id="legend-list" style="flex:1; overflow-y:auto;"></div>
    </div>
</div>

<div class="modal-overlay" id="edit-modal">
    <div class="modal">
        <h3 id="modal-title">新建区块</h3>
        <div class="form-group"><label>功能名称</label><input type="text" id="block-name" placeholder="如：异常件托盘"></div>
        <div class="form-group"><label>详细描述（选填）</label><input type="text" id="block-desc" placeholder="描述功能…"></div>

        <div class="form-group">
            <label>颜色（点色卡，或填色值）</label>
            <div class="swatches" id="swatches"></div>
            <input type="color" id="block-color" value="#2563eb" style="margin-top:6px;">
        </div>

        <div class="form-group">
            <label>位置与整体大小（单位：格）</label>
            <div class="row4">
                <div><label>X</label><input type="number" id="bx" step="1"></div>
                <div><label>Y</label><input type="number" id="by" step="1"></div>
                <div><label>宽</label><input type="number" id="bw" step="1" min="1"></div>
                <div><label>高</label><input type="number" id="bh" step="1" min="1"></div>
            </div>
            <p style="font-size:11px;color:#94a3b8;margin-top:4px;">改宽高会按比例缩放所有分段；只调某一段请用下面的分段表。</p>
        </div>

        <div class="form-group">
            <label>分段（L 形 / T 形由多段拼成）</label>
            <table class="seg-table" id="seg-table"></table>
            <button type="button" class="btn btn-outline" style="margin-top:6px;font-size:12px;padding:4px 8px;" onclick="addSegmentByDraw()">＋ 到画布上拖出新的一段</button>
        </div>

        <div class="form-group"><label>层级 Z-Index（越大越靠上）</label><input type="number" id="block-z" value="1" step="1"></div>

        <div class="modal-actions">
            <button class="btn btn-outline" onclick="closeModal()">取消</button>
            <button class="btn" onclick="saveBlock()">保存</button>
        </div>
    </div>
</div>

<script>
/* ============ 常量与状态 ============ */
var MAX_COLS = 60, MAX_ROWS = 40, MIN_CELL = 20, MAX_CELL = 60, PAD = 26;

var PALETTE = [
  '#2563eb','#0ea5e9','#06b6d4','#10b981','#84cc16','#eab308','#f59e0b','#f97316',
  '#ef4444','#ec4899','#8b5cf6','#6366f1','#64748b','#334155','#a3a3a3','#ffffff'
];
/* 建议用法：货架 A/C=#2563eb，货架 W=#0ea5e9，生鲜=#10b981，冰柜=#06b6d4，
   异常件托盘=#ef4444，入口=#f59e0b，排队区=#fcd34d，帐篷=#8b5cf6，寄件区=#6366f1，通道=#e2e8f0 */

var S = { cols:20, rows:15, cell:30, scale:1 };
var blocks = [];
var activeId = null;
var history = [], hi = -1;
var drag = null;          /* {mode, ...} */
var pendingAddTo = null;  /* 正在给哪个块加段 */
var editId = null;        /* 弹窗编辑的块 id；null=新建 */
var draftParts = null;    /* 新建时先存的分段 */
var ASU = 'yz_layout_v3_autosave';

var svg = document.getElementById('svg');
var wrapper = document.getElementById('wrapper');

/* ============ 工具 ============ */
function uid(){ return Math.random().toString(36).slice(2,10); }
function clamp(v,a,b){ return Math.max(a, Math.min(b, v)); }
function colLabel(i){
  var s = '', n = i;
  do { s = String.fromCharCode(65 + (n % 26)) + s; n = Math.floor(n / 26) - 1; } while (n >= 0);
  return s;
}
function areaOf(b){ return b.parts.reduce(function(a,p){ return a + p.w * p.h; }, 0); }
function bboxOf(parts){
  var x1=Infinity,y1=Infinity,x2=-Infinity,y2=-Infinity;
  parts.forEach(function(p){ x1=Math.min(x1,p.x); y1=Math.min(y1,p.y); x2=Math.max(x2,p.x+p.w); y2=Math.max(y2,p.y+p.h); });
  return { x:x1, y:y1, w:x2-x1, h:y2-y1 };
}
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

/* ============ 画布尺寸 ============ */
function applyCell(){
  S.cell = clamp(parseInt(document.getElementById('cell-size').value)||30, MIN_CELL, MAX_CELL);
  document.getElementById('cell-size').value = S.cell;
  layout();
}
function applyGrid(){
  var c = clamp(parseInt(document.getElementById('grid-cols').value)||20, 5, MAX_COLS);
  var r = clamp(parseInt(document.getElementById('grid-rows').value)||15, 4, MAX_ROWS);
  S.cols = c; S.rows = r;
  document.getElementById('grid-cols').value = c;
  document.getElementById('grid-rows').value = r;
  blocks.forEach(function(b){ b.parts.forEach(function(p){ p.x = Math.min(p.x, c-1); p.y = Math.min(p.y, r-1); p.w = Math.min(p.w, c-p.x); p.h = Math.min(p.h, r-p.y); }); });
  commit(); layout();
}
function extend(dx, dy){
  var n = clamp(parseInt(document.getElementById('extend-n').value)||1, 1, 20);
  if(dx > 0) S.cols = clamp(S.cols + n, 5, MAX_COLS);
  if(dy > 0) S.rows = clamp(S.rows + n, 4, MAX_ROWS);
  if(dx < 0){ var nc = clamp(S.cols + n, 5, MAX_COLS); n = nc - S.cols; S.cols = nc; if(n>0) blocks.forEach(function(b){ b.parts.forEach(function(p){ p.x += n; }); }); }
  if(dy < 0){ var nr = clamp(S.rows + n, 4, MAX_ROWS); n = nr - S.rows; S.rows = nr; if(n>0) blocks.forEach(function(b){ b.parts.forEach(function(p){ p.y += n; }); }); }
  document.getElementById('grid-cols').value = S.cols;
  document.getElementById('grid-rows').value = S.rows;
  commit(); layout();
}
function layout(){
  var W = PAD + S.cols * S.cell, H = PAD + S.rows * S.cell;
  svg.setAttribute('width', W);
  svg.setAttribute('height', H);
  svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
  document.getElementById('stage').style.width = W + 'px';
  document.getElementById('stage').style.height = H + 'px';
  render(); renderLegend();
}

/* ============ 渲染 ============ */
function svgEl(tag, attrs){
  var e = document.createElementNS('http://www.w3.org/2000/svg', tag);
  for(var k in attrs) if(attrs[k] !== null && attrs[k] !== undefined) e.setAttribute(k, attrs[k]);
  return e;
}

function render(){
  var W = PAD + S.cols * S.cell, H = PAD + S.rows * S.cell;
  svg.innerHTML = '';

  var defs = svgEl('defs');
  var pat = svgEl('pattern', { id:'gp', width:S.cell, height:S.cell, patternUnits:'userSpaceOnUse' });
  pat.appendChild(svgEl('path', { d:'M ' + S.cell + ' 0 L 0 0 0 ' + S.cell, fill:'none', stroke:'#e2e8f0', 'stroke-width':1 }));
  defs.appendChild(pat);
  svg.appendChild(defs);

  svg.appendChild(svgEl('rect', { x:PAD, y:PAD, width:S.cols*S.cell, height:S.rows*S.cell, fill:'#fff' }));
  svg.appendChild(svgEl('rect', { x:PAD, y:PAD, width:S.cols*S.cell, height:S.rows*S.cell, fill:'url(#gp)' }));
  svg.appendChild(svgEl('rect', { x:PAD, y:PAD, width:S.cols*S.cell, height:S.rows*S.cell, fill:'none', stroke:'#94a3b8', 'stroke-width':1 }));

  /* 标尺 */
  var ruler = svgEl('g', { 'font-family':'Arial, sans-serif', 'font-size':9, fill:'#94a3b8' });
  for(var c = 0; c < S.cols; c++){
    var t1 = svgEl('text', { x:PAD + c*S.cell + S.cell/2, y:PAD - 8, 'text-anchor':'middle' });
    t1.textContent = colLabel(c);
    ruler.appendChild(t1);
  }
  for(var r = 0; r < S.rows; r++){
    var t2 = svgEl('text', { x:PAD - 8, y:PAD + r*S.cell + S.cell/2 + 3, 'text-anchor':'end' });
    t2.textContent = r + 1;
    ruler.appendChild(t2);
  }
  svg.appendChild(ruler);

  /* 区块 */
  var order = blocks.slice().sort(function(a,b){ return (a.z||1) - (b.z||1); });
  order.forEach(function(b){
    if(b.visible === false) return;
    var g = svgEl('g', { 'data-id':b.id, opacity: b.locked ? 0.75 : 1 });
    svg.appendChild(g);
    b.parts.forEach(function(p){
      g.appendChild(svgEl('rect', {
        x:PAD + p.x*S.cell, y:PAD + p.y*S.cell, width:p.w*S.cell, height:p.h*S.cell,
        fill:b.color, stroke:'rgba(0,0,0,.18)', 'stroke-width':1,
        'data-block':b.id, 'pointer-events': b.locked ? 'none' : 'all',
        style:'cursor:' + (b.locked ? 'default' : 'move')
      }));
    });
    /* 标签放在最大那一段的中心（L/T 形不会落进缺口），并加底板保证可读 */
    var big = b.parts.reduce(function(a, p){ return (p.w * p.h > a.w * a.h) ? p : a; }, b.parts[0]);
    var tx = svgEl('text', {
      x:PAD + (big.x + big.w/2)*S.cell, y:PAD + (big.y + big.h/2)*S.cell + 4,
      'text-anchor':'middle', 'font-family':'-apple-system,PingFang SC,Microsoft YaHei,sans-serif',
      'font-size':12, 'font-weight':'700', fill:'#fff', 'pointer-events':'none'
    });
    tx.textContent = b.name;
    g.appendChild(tx);
    try {
      var tb = tx.getBBox();
      var plate = svgEl('rect', {
        x:tb.x - 4, y:tb.y - 2, width:tb.width + 8, height:tb.height + 4,
        fill:'rgba(15,23,42,.42)', rx:3, 'pointer-events':'none'
      });
      g.insertBefore(plate, tx);
    } catch(err) { /* 未布局时忽略 */ }
  });

  /* 选中框 + 手柄 */
  var sel = blocks.find(function(b){ return b.id === activeId; });
  if(sel && sel.visible !== false){
    var bb2 = bboxOf(sel.parts);
    svg.appendChild(svgEl('rect', {
      x:PAD + bb2.x*S.cell, y:PAD + bb2.y*S.cell, width:bb2.w*S.cell, height:bb2.h*S.cell,
      fill:'none', stroke:'#f59e0b', 'stroke-width':2, 'stroke-dasharray':'6 4', 'pointer-events':'none'
    }));
    if(!sel.locked){
      [['tl',bb2.x,bb2.y],['tr',bb2.x+bb2.w,bb2.y],['bl',bb2.x,bb2.y+bb2.h],['br',bb2.x+bb2.w,bb2.y+bb2.h]].forEach(function(h){
        var cx = PAD + h[1]*S.cell, cy = PAD + h[2]*S.cell;
        var hg = svgEl('g', { 'data-dir':h[0], style:'cursor:' + (h[0]==='tl'||h[0]==='br' ? 'nwse-resize' : 'nesw-resize') });
        hg.appendChild(svgEl('rect', { x:cx-14, y:cy-14, width:28, height:28, fill:'transparent' }));
        hg.appendChild(svgEl('rect', { x:cx-7, y:cy-7, width:14, height:14, fill:'#fff', stroke:'#f59e0b', 'stroke-width':2, rx:3 }));
        svg.appendChild(hg);
      });
    }
  }

  /* 绘制预览 */
  if(drag && drag.mode === 'draw'){
    var d = drag;
    var x = Math.min(d.sx, d.cx), y = Math.min(d.sy, d.cy);
    var w = Math.abs(d.cx - d.sx), h = Math.abs(d.cy - d.sy);
    svg.appendChild(svgEl('rect', {
      x:PAD + x*S.cell, y:PAD + y*S.cell, width:w*S.cell, height:h*S.cell,
      fill:'rgba(37,99,235,.25)', stroke:'#2563eb', 'stroke-width':2, 'stroke-dasharray':'5 3', 'pointer-events':'none'
    }));
  }
}

/* ============ 图例 ============ */
function renderLegend(){
  var scale = parseFloat(document.getElementById('scale-m').value) || 1;
  var el = document.getElementById('legend-list');
  if(!blocks.length){ el.innerHTML = '<p style="padding:16px;color:#94a3b8;font-size:13px;text-align:center;">画布上按住拖动即可新建区块</p>'; return; }
  el.innerHTML = blocks.slice().sort(function(a,b){ return (b.z||1)-(a.z||1); }).map(function(b){
    var area = areaOf(b) * scale * scale;
    var bb = bboxOf(b.parts);
    return '<div class="legend-item ' + (b.id===activeId?'active':'') + '" onclick="select(\'' + b.id + '\')">' +
      '<div class="color-box" style="background:' + b.color + '"></div>' +
      '<div class="legend-info">' +
        '<div class="legend-title">' + esc(b.name) + '</div>' +
        (b.desc ? '<div class="legend-desc">' + esc(b.desc) + '</div>' : '') +
        '<div class="legend-area">' + bb.w + '×' + bb.h + ' 格 · ' + b.parts.length + ' 段 · ≈' + area.toFixed(1) + ' ㎡ · Z' + (b.z||1) + '</div>' +
      '</div>' +
      '<div class="legend-actions">' +
        '<button class="icon-btn ' + (b.visible!==false?'active':'') + '" onclick="toggleVis(\'' + b.id + '\',event)">' + (b.visible!==false?'👁':'🚫') + '</button>' +
        '<button class="icon-btn ' + (b.locked?'active':'') + '" onclick="toggleLock(\'' + b.id + '\',event)">' + (b.locked?'🔒':'🔓') + '</button>' +
        '<button class="icon-btn" onclick="moveZ(\'' + b.id + '\',1,event)">↑</button>' +
        '<button class="icon-btn" onclick="moveZ(\'' + b.id + '\',-1,event)">↓</button>' +
        '<button class="icon-btn" onclick="openEdit(\'' + b.id + '\',event)">✏</button>' +
        '<button class="icon-btn danger" onclick="delBlock(\'' + b.id + '\',event)">✕</button>' +
      '</div></div>';
  }).join('');
}

/* ============ 指针交互 ============ */
function svgPoint(e){
  var r = svg.getBoundingClientRect();
  return { x:e.clientX - r.left, y:e.clientY - r.top };
}
function cellAt(pt){ return { x:Math.round((pt.x - PAD)/S.cell), y:Math.round((pt.y - PAD)/S.cell) }; }

svg.addEventListener('pointerdown', function(e){
  var pt = svgPoint(e);
  var handle = e.target.closest('[data-dir]');
  var hitBlock = e.target.getAttribute && e.target.getAttribute('data-block');

  if(handle){
    var sel = blocks.find(function(b){ return b.id === activeId; });
    if(!sel) return;
    drag = { mode:'resize', dir:handle.getAttribute('data-dir'), bb:bboxOf(sel.parts), parts0:JSON.parse(JSON.stringify(sel.parts)), sx:pt.x, sy:pt.y };
    svg.setPointerCapture(e.pointerId);
    e.preventDefault(); return;
  }

  if(hitBlock){
    var b = blocks.find(function(x){ return x.id === hitBlock; });
    if(!b || b.locked) return;
    if(b.id !== activeId) select(b.id);
    drag = { mode:'move', id:b.id, parts0:JSON.parse(JSON.stringify(b.parts)), sx:pt.x, sy:pt.y, moved:false };
    svg.setPointerCapture(e.pointerId);
    e.preventDefault(); return;
  }

  /* 空白处：新建 或 加段 */
  var c = cellAt(pt);
  c.x = clamp(c.x, 0, S.cols); c.y = clamp(c.y, 0, S.rows);
  drag = { mode:'draw', sx:c.x, sy:c.y, cx:c.x, cy:c.y, addTo:pendingAddTo };
  svg.setPointerCapture(e.pointerId);
  e.preventDefault();
});

svg.addEventListener('pointermove', function(e){
  if(!drag) return;
  var pt = svgPoint(e);

  if(drag.mode === 'draw'){
    var c = cellAt(pt);
    drag.cx = clamp(c.x, 0, S.cols);
    drag.cy = clamp(c.y, 0, S.rows);
    render(); return;
  }

  var dx = Math.round((pt.x - drag.sx)/S.cell);
  var dy = Math.round((pt.y - drag.sy)/S.cell);

  if(drag.mode === 'move'){
    var b = blocks.find(function(x){ return x.id === drag.id; });
    if(!b) return;
    var bb = bboxOf(drag.parts0);
    var nx = clamp(dx, -bb.x, S.cols - (bb.x + bb.w));
    var ny = clamp(dy, -bb.y, S.rows - (bb.y + bb.h));
    b.parts = drag.parts0.map(function(p){ return { x:p.x + nx, y:p.y + ny, w:p.w, h:p.h }; });
    drag.moved = (nx !== 0 || ny !== 0);
    render(); return;
  }

  if(drag.mode === 'resize'){
    var bb0 = drag.bb, dir = drag.dir;
    var nx2 = bb0.x, ny2 = bb0.y, nw = bb0.w, nh = bb0.h;
    if(dir.indexOf('r') >= 0) nw = clamp(bb0.w + dx, 1, S.cols - bb0.x);
    if(dir.indexOf('l') >= 0){ nw = clamp(bb0.w - dx, 1, bb0.x + bb0.w); nx2 = bb0.x + bb0.w - nw; }
    if(dir.indexOf('b') >= 0) nh = clamp(bb0.h + dy, 1, S.rows - bb0.y);
    if(dir.indexOf('t') >= 0){ nh = clamp(bb0.h - dy, 1, bb0.y + bb0.h); ny2 = bb0.y + bb0.h - nh; }
    var sx = nw / bb0.w, sy = nh / bb0.h;
    var blk = blocks.find(function(x){ return x.id === activeId; });
    if(!blk) return;
    blk.parts = drag.parts0.map(function(p){
      return {
        x: Math.round(nx2 + (p.x - bb0.x) * sx),
        y: Math.round(ny2 + (p.y - bb0.y) * sy),
        w: Math.max(1, Math.round(p.w * sx)),
        h: Math.max(1, Math.round(p.h * sy))
      };
    });
    render(); return;
  }
});

svg.addEventListener('pointerup', function(e){
  if(!drag) return;
  var d = drag; drag = null;

  if(d.mode === 'draw'){
    var x = Math.min(d.sx, d.cx), y = Math.min(d.sy, d.cy);
    var w = Math.abs(d.cx - d.sx), h = Math.abs(d.cy - d.sy);
    if(w < 1 || h < 1){ render(); return; }
    if(d.addTo){
      var tb = blocks.find(function(b){ return b.id === d.addTo; });
      if(tb){ tb.parts.push({ x:x, y:y, w:w, h:h }); pendingAddTo = null; commit(); layout(); }
      else render();
    } else {
      draftParts = [{ x:x, y:y, w:w, h:h }];
      editId = null;
      openModal();
    }
    return;
  }

  if(d.mode === 'move' && !d.moved){ render(); return; }
  commit(); layout();
});

/* ============ 选择与图例操作 ============ */
window.select = function(id){ activeId = id; render(); renderLegend(); };

window.toggleVis = function(id, e){
  e.stopPropagation();
  var b = blocks.find(function(x){ return x.id===id; });
  if(b){ b.visible = (b.visible === false); commit(); layout(); }
};
window.toggleLock = function(id, e){
  e.stopPropagation();
  var b = blocks.find(function(x){ return x.id===id; });
  if(b){ b.locked = !b.locked; commit(); layout(); }
};
window.moveZ = function(id, d, e){
  e.stopPropagation();
  var b = blocks.find(function(x){ return x.id===id; });
  if(b){ b.z = (b.z||1) + d; commit(); layout(); }
};
window.delBlock = function(id, e){
  if(e) e.stopPropagation();
  if(!confirm('删除这个区块？')) return;
  blocks = blocks.filter(function(b){ return b.id !== id; });
  if(activeId === id) activeId = null;
  commit(); layout();
};

/* ============ 弹窗 ============ */
function buildSwatches(){
  var box = document.getElementById('swatches');
  box.innerHTML = PALETTE.map(function(c){
    return '<div class="sw" data-c="' + c + '" style="background:' + c + '"></div>';
  }).join('');
  box.querySelectorAll('.sw').forEach(function(el){
    el.addEventListener('click', function(){
      document.getElementById('block-color').value = el.getAttribute('data-c');
      paintSwatch();
    });
  });
}
function paintSwatch(){
  var cur = (document.getElementById('block-color').value || '').toLowerCase();
  document.querySelectorAll('.sw').forEach(function(el){
    el.classList.toggle('on', el.getAttribute('data-c').toLowerCase() === cur);
  });
}

window.openEdit = function(id, e){
  if(e) e.stopPropagation();
  editId = id;
  openModal();
};

function openModal(){
  var b = editId ? blocks.find(function(x){ return x.id === editId; }) : null;
  document.getElementById('modal-title').textContent = b ? '编辑区块' : '新建区块';
  document.getElementById('block-name').value = b ? b.name : '';
  document.getElementById('block-desc').value = b ? (b.desc||'') : '';
  document.getElementById('block-color').value = b ? b.color : '#2563eb';
  document.getElementById('block-z').value = b ? (b.z||1) : (blocks.length ? Math.max.apply(null, blocks.map(function(x){ return x.z||1; })) + 1 : 1);

  var parts = b ? b.parts : draftParts;
  var bb = bboxOf(parts);
  document.getElementById('bx').value = bb.x;
  document.getElementById('by').value = bb.y;
  document.getElementById('bw').value = bb.w;
  document.getElementById('bh').value = bb.h;

  renderSegTable(parts);
  paintSwatch();
  document.getElementById('edit-modal').classList.add('show');
}

function renderSegTable(parts){
  var rows = parts.map(function(p, i){
    return '<tr data-i="' + i + '">' +
      '<td>' + (i+1) + '</td>' +
      '<td><input type="number" class="sg-x" value="' + p.x + '" step="1"></td>' +
      '<td><input type="number" class="sg-y" value="' + p.y + '" step="1"></td>' +
      '<td><input type="number" class="sg-w" value="' + p.w + '" step="1" min="1"></td>' +
      '<td><input type="number" class="sg-h" value="' + p.h + '" step="1" min="1"></td>' +
      '<td>' + (parts.length > 1 ? '<button type="button" class="seg-del" onclick="delSeg(' + i + ')">✕</button>' : '') + '</td>' +
    '</tr>';
  }).join('');
  document.getElementById('seg-table').innerHTML =
    '<thead><tr><th>段</th><th>X</th><th>Y</th><th>宽</th><th>高</th><th></th></tr></thead><tbody>' + rows + '</tbody>';
}

window.delSeg = function(i){
  var parts = readSegs();
  parts.splice(i, 1);
  renderSegTable(parts);
};

function readSegs(){
  var out = [];
  document.querySelectorAll('#seg-table tbody tr').forEach(function(tr){
    out.push({
      x: parseInt(tr.querySelector('.sg-x').value) || 0,
      y: parseInt(tr.querySelector('.sg-y').value) || 0,
      w: Math.max(1, parseInt(tr.querySelector('.sg-w').value) || 1),
      h: Math.max(1, parseInt(tr.querySelector('.sg-h').value) || 1)
    });
  });
  return out;
}

window.addSegmentByDraw = function(){
  /* 先存当前弹窗内容，再进入拖拽加段模式 */
  if(!editId){ alert('新建区块先保存，再用这个功能加段'); return; }
  var b = blocks.find(function(x){ return x.id === editId; });
  if(b){ b.parts = readSegs(); }
  pendingAddTo = editId;
  document.getElementById('edit-modal').classList.remove('show');
  render(); renderLegend();
};

window.closeModal = function(){
  document.getElementById('edit-modal').classList.remove('show');
  editId = null; draftParts = null;
};

window.saveBlock = function(){
  var name = document.getElementById('block-name').value.trim();
  if(!name) return alert('请输入名称');
  var color = document.getElementById('block-color').value;
  var z = parseInt(document.getElementById('block-z').value) || 1;
  var desc = document.getElementById('block-desc').value.trim();

  var parts = readSegs();

  /* 整体位置与大小：以 X/Y/宽/高 重新映射各段 */
  var bb0 = bboxOf(parts);
  var nx = parseInt(document.getElementById('bx').value);
  var ny = parseInt(document.getElementById('by').value);
  var nw = Math.max(1, parseInt(document.getElementById('bw').value) || bb0.w);
  var nh = Math.max(1, parseInt(document.getElementById('bh').value) || bb0.h);
  if(!isNaN(nx) && !isNaN(ny)){
    var sx = nw / bb0.w, sy = nh / bb0.h;
    parts = parts.map(function(p){
      return {
        x: Math.round(nx + (p.x - bb0.x) * sx),
        y: Math.round(ny + (p.y - bb0.y) * sy),
        w: Math.max(1, Math.round(p.w * sx)),
        h: Math.max(1, Math.round(p.h * sy))
      };
    });
  }
  /* 越界裁回画布 */
  parts = parts.map(function(p){
    p.x = clamp(p.x, 0, S.cols - 1); p.y = clamp(p.y, 0, S.rows - 1);
    p.w = Math.min(p.w, S.cols - p.x); p.h = Math.min(p.h, S.rows - p.y);
    return p;
  });

  if(editId){
    var b = blocks.find(function(x){ return x.id === editId; });
    if(b){ b.name = name; b.desc = desc; b.color = color; b.z = z; b.parts = parts; }
  } else if(draftParts){
    var id = uid();
    blocks.push({ id:id, name:name, desc:desc, color:color, z:z, parts:parts, visible:true, locked:false });
    activeId = id;
  }
  draftParts = null; editId = null;
  document.getElementById('edit-modal').classList.remove('show');
  commit(); layout();
};

/* ============ 历史 ============ */
function snapshot(){ return JSON.stringify({ cols:S.cols, rows:S.rows, cell:S.cell, scale:S.scale, blocks:blocks }); }
function commit(){
  var s = snapshot();
  if(history[hi] === s) return;
  history = history.slice(0, hi + 1);
  history.push(s); hi = history.length - 1;
  updateHist();
  localStorage.setItem(ASU, s);
}
function updateHist(){
  document.getElementById('btn-undo').disabled = hi <= 0;
  document.getElementById('btn-redo').disabled = hi >= history.length - 1;
}
window.undo = function(){ if(hi > 0){ hi--; applySnap(history[hi]); } };
window.redo = function(){ if(hi < history.length - 1){ hi++; applySnap(history[hi]); } };
function applySnap(s){
  var d = JSON.parse(s);
  S.cols = d.cols; S.rows = d.rows; S.cell = d.cell; S.scale = d.scale;
  blocks = d.blocks;
  document.getElementById('grid-cols').value = S.cols;
  document.getElementById('grid-rows').value = S.rows;
  document.getElementById('cell-size').value = S.cell;
  document.getElementById('scale-m').value = d.scale;
  activeId = null;
  layout(); updateHist();
  localStorage.setItem(ASU, s);
}

/* ============ 导入导出 ============ */
window.exportJSON = function(){
  var data = {
    schemaVersion: 3,
    grid: { cols:S.cols, rows:S.rows, cell:S.cell },
    scale: parseFloat(document.getElementById('scale-m').value) || 1,
    blocks: blocks
  };
  var blob = new Blob([JSON.stringify(data, null, 2)], { type:'application/json' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = '驿站布局数据_v3.json';
  a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); }, 1500);
};

window.exportPNG = function(){
  activeId = null; render();
  var clone = svg.cloneNode(true);
  clone.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
  var W = PAD + S.cols*S.cell, H = PAD + S.rows*S.cell;
  var bg = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
  bg.setAttribute('x', 0); bg.setAttribute('y', 0);
  bg.setAttribute('width', W); bg.setAttribute('height', H);
  bg.setAttribute('fill', '#ffffff');
  clone.insertBefore(bg, clone.firstChild);
  var src = new XMLSerializer().serializeToString(clone);
  var url = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(src);
  var img = new Image();
  img.onload = function(){
    var k = 2, cv = document.createElement('canvas');
    cv.width = W * k; cv.height = H * k;
    var ctx = cv.getContext('2d');
    ctx.fillStyle = '#fff'; ctx.fillRect(0,0,cv.width,cv.height);
    ctx.drawImage(img, 0, 0, cv.width, cv.height);
    var a = document.createElement('a');
    a.download = '驿站平面布局图.png';
    a.href = cv.toDataURL('image/png');
    a.click();
  };
  img.onerror = function(){ alert('导出失败，可先用浏览器截图'); };
  img.src = url;
};

window.importJSON = function(e){
  var f = e.target.files[0]; if(!f) return;
  var reader = new FileReader();
  reader.onload = function(ev){
    try{
      var d = JSON.parse(ev.target.result);
      if(d.grid && Array.isArray(d.blocks)){
        /* v3 */
        S.cols = clamp(d.grid.cols||20, 5, MAX_COLS);
        S.rows = clamp(d.grid.rows||15, 4, MAX_ROWS);
        S.cell = clamp(d.grid.cell||30, MIN_CELL, MAX_CELL);
        blocks = d.blocks.map(normalizeBlock);
        document.getElementById('scale-m').value = d.scale || 1;
      } else if(d.gridCols && Array.isArray(d.blocks)){
        /* v2 兼容：{x,y,w,h} → parts */
        S.cols = clamp(d.gridCols||20, 5, MAX_COLS);
        S.rows = clamp(d.gridRows||15, 4, MAX_ROWS);
        S.cell = 30;
        blocks = d.blocks.map(normalizeBlock);
        document.getElementById('scale-m').value = d.scale || 1;
      } else {
        alert('文件格式不正确'); return;
      }
      S.scale = parseFloat(document.getElementById('scale-m').value) || 1;
      document.getElementById('grid-cols').value = S.cols;
      document.getElementById('grid-rows').value = S.rows;
      document.getElementById('cell-size').value = S.cell;
      activeId = null;
      history = []; hi = -1;
      layout(); commit();
      alert('导入成功：' + blocks.length + ' 个区块');
    }catch(err){ alert('解析失败：' + err.message); }
  };
  reader.readAsText(f);
  e.target.value = '';
};

function normalizeBlock(b){
  var parts = Array.isArray(b.parts) && b.parts.length
    ? b.parts.map(function(p){ return { x:p.x, y:p.y, w:p.w, h:p.h }; })
    : [{ x:b.x||0, y:b.y||0, w:b.w||1, h:b.h||1 }];
  return {
    id: b.id || uid(),
    name: b.name || '未命名',
    desc: b.desc || '',
    color: b.color || '#2563eb',
    z: b.z != null ? b.z : (b.zIndex != null ? b.zIndex : 1),
    parts: parts,
    visible: b.visible !== false && b.isVisible !== false,
    locked: !!(b.locked || b.isLocked)
  };
}

window.clearAll = function(){
  if(!confirm('清空所有区块？')) return;
  blocks = []; activeId = null;
  history = []; hi = -1;
  localStorage.removeItem(ASU);
  layout(); commit();
};

/* ============ 启动 ============ */
(function init(){
  var saved = localStorage.getItem(ASU);
  if(saved){
    try{
      var d = JSON.parse(saved);
      S.cols = d.cols || 20; S.rows = d.rows || 15;
      S.cell = clamp(d.cell || 30, MIN_CELL, MAX_CELL);
      S.scale = d.scale || 1;
      blocks = (d.blocks || []).map(normalizeBlock);
      document.getElementById('grid-cols').value = S.cols;
      document.getElementById('grid-rows').value = S.rows;
      document.getElementById('cell-size').value = S.cell;
      document.getElementById('scale-m').value = S.scale;
    }catch(e){}
  }
  buildSwatches();
  document.getElementById('block-color').addEventListener('input', paintSwatch);
  document.getElementById('scale-m').addEventListener('input', renderLegend);
  layout();
  commit();
})();
</script>
</body>
