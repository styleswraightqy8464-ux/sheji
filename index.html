<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>驿站平面布局设计</title>
<!-- 引入 html2canvas 用于导出图片 -->
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<style>
    :root { --primary: #2563eb; --bg: #f1f5f9; --border: #cbd5e1; }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: var(--bg); display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
    
    /* 顶部工具栏 */
    .toolbar { background: #fff; padding: 10px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; border-bottom: 1px solid var(--border); z-index: 100; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
    .tool-group { display: flex; align-items: center; gap: 5px; font-size: 14px; }
    .tool-group input[type="number"] { width: 50px; padding: 4px; border: 1px solid var(--border); border-radius: 4px; }
    .btn { padding: 6px 12px; border: none; border-radius: 6px; background: var(--primary); color: #fff; cursor: pointer; font-size: 14px; font-weight: 600; }
    .btn:active { opacity: 0.8; }
    .btn-outline { background: #fff; color: #333; border: 1px solid var(--border); }
    .btn-danger { background: #ef4444; }

    /* 主体布局 */
    .main-container { display: flex; flex: 1; overflow: hidden; position: relative; }
    
    /* 左侧画布区 */
    .canvas-wrapper { flex: 1; overflow: auto; position: relative; background: #e2e8f0; touch-action: none; }
    .grid-container { position: relative; background-color: #fff; margin: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    
    /* 网格线背景 */
    .grid-bg { position: absolute; inset: 0; pointer-events: none; }
    
    /* 绘制的区块 */
    .block { position: absolute; border: 2px solid transparent; box-sizing: border-box; display: flex; flex-direction: column; justify-content: center; align-items: center; overflow: hidden; font-size: 12px; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,0.5); cursor: pointer; transition: box-shadow 0.2s; }
    .block:hover { border-color: #fff; box-shadow: 0 0 0 2px #000; z-index: 9999 !important; }
    .block.selected { border-color: #fbbf24; box-shadow: 0 0 0 3px #fbbf24; z-index: 9998 !important; }
    .block .block-name { font-weight: bold; text-align: center; padding: 0 4px; word-break: break-all; }

    /* 画图时的预览框 */
    .drawing-preview { position: absolute; background: rgba(37, 99, 235, 0.3); border: 2px dashed var(--primary); pointer-events: none; z-index: 10000; }

    /* 右侧侧边栏（图例） */
    .sidebar { width: 300px; background: #fff; border-left: 1px solid var(--border); display: flex; flex-direction: column; overflow-y: auto; }
    .sidebar-header { padding: 15px; font-weight: bold; border-bottom: 1px solid var(--border); background: #f8fafc; }
    .legend-item { padding: 10px 15px; border-bottom: 1px solid var(--border); display: flex; align-items: flex-start; gap: 10px; cursor: pointer; transition: background 0.2s; }
    .legend-item:hover { background: #f1f5f9; }
    .legend-item.active { background: #e0f2fe; border-left: 4px solid var(--primary); }
    .color-box { width: 20px; height: 20px; border-radius: 4px; flex-shrink: 0; border: 1px solid rgba(0,0,0,0.2); }
    .legend-info { flex: 1; }
    .legend-title { font-size: 14px; font-weight: bold; margin-bottom: 2px; }
    .legend-desc { font-size: 12px; color: #64748b; line-height: 1.3; }
    .legend-area { font-size: 11px; color: var(--primary); margin-top: 4px; }
    .legend-actions { display: flex; flex-direction: column; gap: 4px; }
    .btn-mini { padding: 2px 6px; font-size: 11px; border-radius: 4px; border: 1px solid var(--border); background: #fff; cursor: pointer; }

    /* 弹窗 */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: none; justify-content: center; align-items: center; z-index: 99999; }
    .modal-overlay.show { display: flex; }
    .modal { background: #fff; width: 90%; max-width: 400px; border-radius: 12px; padding: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); }
    .modal h3 { margin-bottom: 15px; font-size: 18px; }
    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 13px; color: #64748b; margin-bottom: 4px; }
    .form-group input[type="text"], .form-group textarea { width: 100%; padding: 8px; border: 1px solid var(--border); border-radius: 6px; font-family: inherit; font-size: 14px; }
    .form-group input[type="color"] { width: 100%; height: 40px; padding: 0; border: none; cursor: pointer; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }

    /* 响应式：手机端侧边栏在下 */
    @media (max-width: 768px) {
        .main-container { flex-direction: column; }
        .canvas-wrapper { flex: 2; }
        .sidebar { width: 100%; flex: 1; border-left: none; border-top: 1px solid var(--border); }
    }
</style>
</head>
<body>

<!-- 顶部工具栏 -->
<div class="toolbar">
    <div class="tool-group">
        <span>网格:</span>
        <input type="number" id="grid-cols" value="20" min="5" max="100"> × 
        <input type="number" id="grid-rows" value="15" min="5" max="100">
        <button class="btn btn-outline" onclick="rebuildGrid()">生成</button>
    </div>
    <div class="tool-group">
        <span>比例:</span>
        <span>1格=</span>
        <input type="number" id="scale-m" value="1" min="0.1" step="0.1" style="width: 60px;">
        <span>米</span>
    </div>
    <div class="tool-group" style="margin-left: auto;">
        <button class="btn btn-outline" id="btn-undo" onclick="undo()" disabled>↩️ 撤销</button>
        <button class="btn btn-outline" id="btn-redo" onclick="redo()" disabled>↪️ 重做</button>
        <button class="btn btn-outline" onclick="exportPNG()">📸 导出图片</button>
        <button class="btn btn-outline" onclick="exportJSON()">💾 导出JSON</button>
        <button class="btn btn-danger" onclick="clearAll()">清空</button>
    </div>
</div>

<div class="main-container">
    <!-- 左侧画布 -->
    <div class="canvas-wrapper" id="canvas-wrapper">
        <div class="grid-container" id="grid-container">
            <div class="grid-bg" id="grid-bg"></div>
            <!-- 动态生成的区块将放在这里 -->
            <div class="drawing-preview" id="drawing-preview" style="display: none;"></div>
        </div>
    </div>

    <!-- 右侧图例 -->
    <div class="sidebar">
        <div class="sidebar-header">图例与区块说明 (点击可定位)</div>
        <div id="legend-list" style="flex:1; overflow-y:auto;">
            <!-- 动态生成 -->
        </div>
    </div>
</div>

<!-- 编辑弹窗 -->
<div class="modal-overlay" id="edit-modal">
    <div class="modal">
        <h3 id="modal-title">新建区块</h3>
        <div class="form-group">
            <label>功能名称</label>
            <input type="text" id="block-name" placeholder="如：异常件托盘">
        </div>
        <div class="form-group">
            <label>详细描述 (选填)</label>
            <textarea id="block-desc" rows="3" placeholder="如：存放滞留、改约件"></textarea>
        </div>
        <div class="form-group">
            <label>区块颜色</label>
            <input type="color" id="block-color" value="#2563eb">
        </div>
        <div class="modal-actions">
            <button class="btn btn-outline" onclick="closeModal()">取消</button>
            <button class="btn" id="btn-save-block" onclick="saveBlock()">保存</button>
        </div>
    </div>
</div>

<script>
// ========== 全局状态 ==========
let cellSize = 30; // 默认每格 30px
let gridCols = 20;
let gridRows = 15;
let blocks = []; // 存储所有区块数据
let historyStack = []; // 历史快照
let historyIndex = -1; // 当前历史位置
let isDrawing = false;
let startX = 0, startY = 0;
let currentPreview = null;
let editingBlockId = null;
let autoSaveKey = 'yz_layout_autosave_v1';

// DOM 元素
const wrapper = document.getElementById('canvas-wrapper');
const container = document.getElementById('grid-container');
const gridBg = document.getElementById('grid-bg');
const previewBox = document.getElementById('drawing-preview');
const legendList = document.getElementById('legend-list');

// ========== 初始化与网格 ==========
function init() {
    // 尝试加载自动保存数据
    const saved = localStorage.getItem(autoSaveKey);
    if (saved) {
        try {
            const data = JSON.parse(saved);
            gridCols = data.gridCols || 20;
            gridRows = data.gridRows || 15;
            blocks = data.blocks || [];
            document.getElementById('grid-cols').value = gridCols;
            document.getElementById('grid-rows').value = gridRows;
            document.getElementById('scale-m').value = data.scale || 1;
        } catch(e) { console.error("读取自动保存失败", e); }
    }
    
    rebuildGrid();
    pushHistory(true); // 初始化历史记录
    
    // 绑定画布事件
    container.addEventListener('pointerdown', onPointerDown);
    document.addEventListener('pointermove', onPointerMove);
    document.addEventListener('pointerup', onPointerUp);
}

function rebuildGrid() {
    gridCols = parseInt(document.getElementById('grid-cols').value) || 20;
    gridRows = parseInt(document.getElementById('grid-rows').value) || 15;
    
    // 计算画布大小，如果手机屏幕小，自动缩小格子
    const maxW = wrapper.clientWidth - 40;
    cellSize = Math.min(30, Math.floor(maxW / gridCols));
    if(cellSize < 10) cellSize = 10; // 最小格子限制

    container.style.width = (gridCols * cellSize) + 'px';
    container.style.height = (gridRows * cellSize) + 'px';

    // 绘制网格背景 (使用 CSS 渐变)
    gridBg.style.backgroundImage = `
        linear-gradient(to right, #e2e8f0 1px, transparent 1px),
        linear-gradient(to bottom, #e2e8f0 1px, transparent 1px)
    `;
    gridBg.style.backgroundSize = `${cellSize}px ${cellSize}px`;

    renderBlocks();
    renderLegend();
}

// ========== 绘制交互 ==========
function getGridPos(e) {
    const rect = container.getBoundingClientRect();
    // 计算相对容器的坐标，并转换为格子索引
    let x = Math.floor((e.clientX - rect.left) / cellSize);
    let y = Math.floor((e.clientY - rect.top) / cellSize);
    // 边界限制
    x = Math.max(0, Math.min(x, gridCols - 1));
    y = Math.max(0, Math.min(y, gridRows - 1));
    return { x, y };
}

function onPointerDown(e) {
    if (e.target.closest('.block')) return; // 点击已有区块不触发画图
    if (e.button !== 0 && e.pointerType === 'mouse') return; // 只允许左键

    isDrawing = true;
    const pos = getGridPos(e);
    startX = pos.x;
    startY = pos.y;

    // 显示预览框
    previewBox.style.display = 'block';
    updatePreviewBox(startX, startY, startX, startY);
    
    // 清除选中状态
    document.querySelectorAll('.block').forEach(b => b.classList.remove('selected'));
    document.querySelectorAll('.legend-item').forEach(l => l.classList.remove('active'));
}

function onPointerMove(e) {
    if (!isDrawing) return;
    const pos = getGridPos(e);
    
    // 计算当前矩形框（支持反向拖拽）
    const minX = Math.min(startX, pos.x);
    const minY = Math.min(startY, pos.y);
    const maxX = Math.max(startX, pos.x);
    const maxY = Math.max(startY, pos.y);
    
    updatePreviewBox(minX, minY, maxX, maxY);
}

function onPointerUp(e) {
    if (!isDrawing) return;
    isDrawing = false;
    previewBox.style.display = 'none';

    const pos = getGridPos(e);
    const minX = Math.min(startX, pos.x);
    const minY = Math.min(startY, pos.y);
    const maxX = Math.max(startX, pos.x);
    const maxY = Math.max(startY, pos.y);

    const w = maxX - minX + 1;
    const h = maxY - minY + 1;

    // 如果只是点击了一下，没有拖拽出面积，忽略
    if (w <= 1 && h <= 1 && startX === pos.x && startY === pos.y) {
        // 如果点击的是空白区域，取消所有选中
        renderLegend();
        return;
    }

    // 弹出编辑框
    editingBlockId = null; // 新建
    document.getElementById('modal-title').textContent = '新建区块';
    document.getElementById('block-name').value = '';
    document.getElementById('block-desc').value = '';
    document.getElementById('block-color').value = getRandomColor();
    
    // 临时保存当前画的框尺寸
    window.tempBlock = { x: minX, y: minY, w, h };
    
    document.getElementById('edit-modal').classList.add('show');
}

function updatePreviewBox(x1, y1, x2, y2) {
    previewBox.style.left = (x1 * cellSize) + 'px';
    previewBox.style.top = (y1 * cellSize) + 'px';
    previewBox.style.width = ((x2 - x1 + 1) * cellSize) + 'px';
    previewBox.style.height = ((y2 - y1 + 1) * cellSize) + 'px';
}

// ========== 区块与图例渲染 ==========
function renderBlocks() {
    // 清除旧的区块
    document.querySelectorAll('.block').forEach(b => b.remove());
    
    // 按层级排序后渲染，保证层级高的在后面
    blocks.forEach(b => {
        const div = document.createElement('div');
        div.className = 'block';
        div.id = 'block-' + b.id;
        div.style.left = (b.x * cellSize) + 'px';
        div.style.top = (b.y * cellSize) + 'px';
        div.style.width = (b.w * cellSize) + 'px';
        div.style.height = (b.h * cellSize) + 'px';
        div.style.backgroundColor = b.color;
        div.style.zIndex = b.z || 1; // 默认层级 1
        div.innerHTML = `<div class="block-name">${b.name || '未命名'}</div>`;
        
        // 点击选中区块
        div.addEventListener('pointerdown', (e) => {
            e.stopPropagation(); // 阻止画新图
            selectBlock(b.id);
        });

        container.appendChild(div);
    });
}

function renderLegend() {
    legendList.innerHTML = blocks.slice().sort((a, b) => (b.z || 1) - (a.z || 1)).map(b => {
        const scale = parseFloat(document.getElementById('scale-m').value) || 1;
        const area = (b.w * scale) * (b.h * scale);
        const isActive = document.querySelector(`.block[id="block-${b.id}"]`)?.classList.contains('selected');
        
        return `
        <div class="legend-item ${isActive ? 'active' : ''}" id="legend-${b.id}" onclick="selectBlock('${b.id}')">
            <div class="color-box" style="background:${b.color}"></div>
            <div class="legend-info">
                <div class="legend-title">${b.name || '未命名'}</div>
                ${b.desc ? `<div class="legend-desc">${b.desc}</div>` : ''}
                <div class="legend-area">尺寸: ${b.w}×${b.h}格 ≈ ${area.toFixed(1)}㎡</div>
            </div>
            <div class="legend-actions">
                <button class="btn-mini" onclick="event.stopPropagation(); editBlock('${b.id}')">编辑</button>
                <button class="btn-mini" style="color:red;" onclick="event.stopPropagation(); deleteBlock('${b.id}')">删除</button>
                <button class="btn-mini" onclick="event.stopPropagation(); bringToFront('${b.id}')">置顶</button>
            </div>
        </div>
        `;
    }).join('');
}

function selectBlock(id) {
    // 清除所有选中
    document.querySelectorAll('.block').forEach(b => b.classList.remove('selected'));
    document.querySelectorAll('.legend-item').forEach(l => l.classList.remove('active'));
    
    // 选中目标
    const blockEl = document.getElementById('block-' + id);
    const legendEl = document.getElementById('legend-' + id);
    if (blockEl) blockEl.classList.add('selected');
    if (legendEl) {
        legendEl.classList.add('active');
        legendEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }
}

// ========== 弹窗与数据操作 ==========
window.closeModal = function() {
    document.getElementById('edit-modal').classList.remove('show');
    window.tempBlock = null;
}

window.saveBlock = function() {
    const name = document.getElementById('block-name').value.trim();
    const desc = document.getElementById('block-desc').value.trim();
    const color = document.getElementById('block-color').value;
    
    if (!name) { alert('请输入功能名称'); return; }

    if (editingBlockId) {
        // 修改已有
        const b = blocks.find(x => x.id === editingBlockId);
        if (b) { b.name = name; b.desc = desc; b.color = color; }
    } else if (window.tempBlock) {
        // 新建
        blocks.push({
            id: generateId(),
            x: window.tempBlock.x,
            y: window.tempBlock.y,
            w: window.tempBlock.w,
            h: window.tempBlock.h,
            name, desc, color,
            z: blocks.length + 1 // 新建的层级最高
        });
    }
    
    closeModal();
    saveToHistory();
    renderBlocks();
    renderLegend();
}

window.editBlock = function(id) {
    const b = blocks.find(x => x.id === id);
    if (!b) return;
    editingBlockId = id;
    document.getElementById('modal-title').textContent = '编辑区块';
    document.getElementById('block-name').value = b.name;
    document.getElementById('block-desc').value = b.desc || '';
    document.getElementById('block-color').value = b.color;
    document.getElementById('edit-modal').classList.add('show');
}

window.deleteBlock = function(id) {
    if (!confirm('确定删除该区块吗？')) return;
    blocks = blocks.filter(x => x.id !== id);
    saveToHistory();
    renderBlocks();
    renderLegend();
}

window.bringToFront = function(id) {
    const b = blocks.find(x => x.id === id);
    if (!b) return;
    const maxZ = Math.max(...blocks.map(x => x.z || 1));
    b.z = maxZ + 1;
    saveToHistory();
    renderBlocks();
    renderLegend();
}

// ========== 历史记录 (撤销/重做) ==========
function pushHistory(isInit = false) {
    if (!isInit && historyIndex < historyStack.length - 1) {
        historyStack = historyStack.slice(0, historyIndex + 1);
    }
    const snapshot = JSON.stringify({ gridCols, gridRows, blocks });
    if (historyStack[historyIndex] === snapshot) return; // 没变就不记录
    historyStack.push(snapshot);
    historyIndex++;
    updateHistoryButtons();
}

function saveToHistory() {
    pushHistory();
    localStorage.setItem(autoSaveKey, JSON.stringify({ gridCols, gridRows, blocks, scale: document.getElementById('scale-m').value }));
}

window.undo = function() {
    if (historyIndex > 0) {
        historyIndex--;
        applySnapshot(historyStack[historyIndex]);
    }
}

window.redo = function() {
    if (historyIndex < historyStack.length - 1) {
        historyIndex++;
        applySnapshot(historyStack[historyIndex]);
    }
}

function applySnapshot(snapshotStr) {
    const data = JSON.parse(snapshotStr);
    gridCols = data.gridCols;
    gridRows = data.gridRows;
    blocks = data.blocks;
    document.getElementById('grid-cols').value = gridCols;
    document.getElementById('grid-rows').value = gridRows;
    rebuildGrid();
    updateHistoryButtons();
    localStorage.setItem(autoSaveKey, snapshotStr);
}

function updateHistoryButtons() {
    document.getElementById('btn-undo').disabled = historyIndex <= 0;
    document.getElementById('btn-redo').disabled = historyIndex >= historyStack.length - 1;
}

// ========== 导出与清空 ==========
window.exportPNG = function() {
    // 移除所有选中状态和预览框
    document.querySelectorAll('.block').forEach(b => b.classList.remove('selected'));
    if (historyIndex >= 0) pushHistory(); // 保存当前状态

    html2canvas(container, { scale: 2, backgroundColor: '#ffffff' }).then(canvas => {
        const link = document.createElement('a');
        link.download = '驿站平面布局图.png';
        link.href = canvas.toDataURL('image/png');
        link.click();
    });
}

window.exportJSON = function() {
    const scale = document.getElementById('scale-m').value;
    const data = {
        gridCols, gridRows, scale,
        blocks: blocks.map(b => ({
            name: b.name, desc: b.desc,
            x: b.x, y: b.y, w: b.w, h: b.h,
            area: (b.w * scale) * (b.h * scale) // 计算实际面积
        }))
    };
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = '驿站布局数据.json';
    a.click();
    URL.revokeObjectURL(url);
}

window.clearAll = function() {
    if (!confirm('确定清空所有区块并重置画布吗？')) return;
    blocks = [];
    historyStack = [];
    historyIndex = -1;
    localStorage.removeItem(autoSaveKey);
    rebuildGrid();
    pushHistory(true);
}

// ========== 辅助工具 ==========
function generateId() { return Math.random().toString(36).substr(2, 9); }
function getRandomColor() {
    const colors = ['#2563eb', '#059669', '#dc2626', '#d97706', '#7c3aed', '#db2777', '#0891b2', '#4b5563'];
    return colors[Math.floor(Math.random() * colors.length)];
}

// 监听比例尺输入，实时更新图例面积
document.getElementById('scale-m').addEventListener('input', renderLegend);

// 启动
window.onload = init;
</script>
</body>
</html>
